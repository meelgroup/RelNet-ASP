
name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake bison re2c python3-pip

      - name: Run build
        run: |
          chmod +x build.sh
          ./build.sh
          
      - name: Sample Run
        run: |
          python scripts/run-relnet-asp.py -i graph_molise.pl 2>&1 | tee /tmp/out.txt
          grep -q "The network reliability:" /tmp/out.txt
